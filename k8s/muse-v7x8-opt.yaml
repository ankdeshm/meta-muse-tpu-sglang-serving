apiVersion: v1
kind: Service
metadata:
  name: muse-v7x8-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: muse-v7x8-opt
---
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-v7x8-opt
  namespace: default
spec:
  backoffLimit: 0
  completions: 2
  parallelism: 2
  completionMode: Indexed
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
    spec:
      subdomain: muse-v7x8-svc
      terminationGracePeriodSeconds: 5
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v7x-cluster-8-pool-a
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: sglang
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/sglang-torchtpu-diffusion:v0.2.0
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          python3 -u /sweep/run_muse_sweep.py \
            --plan /sweep/plan_muse_v7x8_opt.json \
            --proxy-script /sweep/muse_multi_replica_proxy.py \
            --out-root /models/benchmark-results
        env:
        - name: MUSE_RUN_TS
          value: "20261106T012500Z"
        - name: MUSE_WORKER_HOSTS
          value: "muse-v7x8-opt-0.muse-v7x8-svc.default.svc.cluster.local,muse-v7x8-opt-1.muse-v7x8-svc.default.svc.cluster.local"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-muse
              key: HF_TOKEN
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "48"
            memory: 400Gi
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: models-gcs
          mountPath: /models
        - name: sweep
          mountPath: /sweep
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
      - name: sweep
        configMap:
          name: sglang-muse-sweep
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 160Gi
