apiVersion: v1
kind: Service
metadata:
  name: muse-spark-v5p32-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: muse-spark-v5p32
---
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-spark-v5p32
  namespace: default
spec:
  backoffLimit: 0
  completions: 8
  parallelism: 8
  completionMode: Indexed
  template:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
    spec:
      subdomain: muse-spark-v5p32-svc
      terminationGracePeriodSeconds: 5
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5p-32-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x4x4
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-spot
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: sglang
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/sglang-torchtpu-diffusion:v0.2.0
        command:
        - bash
        - -lc
        - |
          set -euo pipefail
          python3 /sweep/run_muse_sweep.py \
            --plan /sweep/plan_spark_v5p32.json \
            --only spark_bf16_v5p32_tp32_ep32_dflash8,spark_bf16_v5p32_tp32_ep8,spark_bf16_v5p32_tp32_ep1 \
            --out-root /models/benchmark-results
        env:
        - name: MUSE_RUN_TS
          value: "20261103T112800Z"
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-muse
              key: HF_TOKEN
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "48"
            memory: 200Gi
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: models-gcs
          mountPath: /models
        - name: sweep
          mountPath: /sweep
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
      - name: sweep
        configMap:
          name: sglang-muse-sweep
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 160Gi
