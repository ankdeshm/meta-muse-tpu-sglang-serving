---
apiVersion: batch/v1
kind: Job
metadata:
  name: muse-glimmer-v7x
  namespace: default
  labels: {app: muse-sweep, muse-job: muse-glimmer-v7x}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: muse-sweep, muse-job: muse-glimmer-v7x}
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v7x-cluster-8-pool-b
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
        kubernetes.io/hostname: gke-tpu-771db71a-cz6l
      tolerations:
      - {key: google.com/tpu, operator: Exists, effect: NoSchedule}
      - {key: cloud.google.com/gke-queued, operator: Exists, effect: NoSchedule}
      containers:
      - name: sglang
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/vllm/sglang-torchtpu-diffusion:v0.2.0
        imagePullPolicy: IfNotPresent
        command: ["bash", "-lc"]
        args:
        - |
          set -euo pipefail
          df -h /dev/shm | tail -1
          for m in gs://YOUR_GCS_BUCKET/models/meta-models/Muse-Glimmer-30B/_STAGE_COMPLETE.txt gs://YOUR_GCS_BUCKET/models/meta-models/Muse-Glimmer-30B-assistant/_STAGE_COMPLETE.txt; do
            until gcloud storage ls "$m" >/dev/null 2>&1; do echo "waiting for $m"; sleep 30; done
          done
          python3 /sweep/run_muse_sweep.py --plan /sweep/plan_glimmer_v7x.json --only glimmer_bf16_tp8,glimmer_bf16_tp8_dflash16,glimmer_fp8_tp8,glimmer_bf16_tp4_dp2,glimmer_fp8_tp8_dflash16 --tag-suffix _all \
            --out-root /models/benchmark-results
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef: {name: hf-token, key: HF_TOKEN}
        - name: PJRT_DEVICE
          value: "TPU"
        - name: NODE_NAME
          valueFrom:
            fieldRef: {fieldPath: spec.nodeName}
        resources:
          requests:
            google.com/tpu: "4"
            cpu: "96"
            memory: 400Gi
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - {name: models-gcs, mountPath: /models}
        - {name: sweep, mountPath: /sweep}
        - {name: dshm, mountPath: /dev/shm}
      volumes:
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
      - name: sweep
        configMap:
          name: sglang-muse-sweep
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 400Gi
